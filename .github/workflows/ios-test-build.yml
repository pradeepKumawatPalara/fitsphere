name: iOS test build

# Started by hand only: Actions > "iOS test build" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iPhone app (.ipa)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      # expo-camera, expo-file-system, expo-font and expo-image-manipulator ship prebuilt
      # iOS code that needs expo-modules-jsi 58.0.21 or newer. 58.0.20 makes the app
      # close at launch ("Symbol not found ... JavaScriptEncodable ... encode(into:in:)").
      - name: Update expo-modules-jsi for the prebuilt Expo modules
        run: |
          npm install --no-save expo-modules-jsi@~58.0.23
          node -p "'expo-modules-jsi ' + require('expo-modules-jsi/package.json').version"

      - name: Create the native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean
        env:
          CI: "1"

      # Release, not Debug: a Debug app is a development client that waits for a Metro server.
      # Release puts the JavaScript inside the app. The EXPO_PUBLIC_* values are read while the
      # JavaScript is bundled (same values as the "preview" profile in apps/mobile/eas.json);
      # without them the app cannot reach the server or sign in.
      - name: Build the app (no signing; Sideloadly signs it later)
        working-directory: apps/mobile/ios
        env:
          EXPO_PUBLIC_API_URL: https://fitsphere-api-163496400043.asia-southeast1.run.app
          EXPO_PUBLIC_SUPABASE_URL: https://vmieqpjevwkdagshbyyo.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_BgiTF0k-H5fQKpxzE41tGA_Fen8ywQb
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package as .ipa
        working-directory: apps/mobile/ios
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FitSphere.ipa Payload
          ls -lh FitSphere.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FitSphere-ios
          path: apps/mobile/ios/FitSphere.ipa
          retention-days: 30
