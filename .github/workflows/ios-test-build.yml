name: iOS test build

# Started by hand only: Actions > "iOS test build" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iPhone development app (.ipa)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Create the native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean
        env:
          CI: "1"

      - name: Build the app (no signing; Sideloadly signs it later)
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package as .ipa
        working-directory: apps/mobile/ios
        run: |
          APP=$(ls -d build/Build/Products/Debug-iphoneos/*.app | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FitSphere-dev.ipa Payload
          ls -lh FitSphere-dev.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FitSphere-ios
          path: apps/mobile/ios/FitSphere-dev.ipa
          retention-days: 30
