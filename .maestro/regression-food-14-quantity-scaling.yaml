appId: com.fitsphere.app
name: Double and half a food's quantity, every value scales exactly (FOOD-14)
tags:
  - regression
---
# Chapati/Roti (INDB ASC096): per 100 g 202.31 kcal, protein 5.88 g, carbs 35.65 g, fat 3.56 g,
# fibre 6.31 g; 1 chapati is 36 g. Each value is worked out from the grams (value per 100 g x grams,
# to hundredths), then shown: kcal whole, grams to one decimal. So doubling 4.2 g of protein shows
# 8.5 g, not 8.4: 4.23 doubled is 8.46.
#   2 chapati,  72 g: 146 kcal, protein 4.2, carbs 25.7, fat 2.6, fibre 4.5
#   4 chapati, 144 g: 291 kcal, protein 8.5, carbs 51.3, fat 5.1, fibre 9.1
#   1 chapati,  36 g:  73 kcal, protein 2.1, carbs 12.8, fat 1.3, fibre 2.3
# Nothing is added or saved, so there is nothing to clean up.

# Sign in (as smoke-04)
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Forgot password?"
    timeout: 20000
- tapOn: "Email"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "Sign in"
    below:
      text: "Forgot password?"
- extendedWaitUntil:
    visible: "Calories"
    timeout: 90000

# Nutrition: + on Breakfast, then choose Lunch (as smoke-04)
- tapOn: "Nutrition"
- tapOn: "Add to Breakfast"
- extendedWaitUntil:
    visible: "Search foods"
    timeout: 10000
- tapOn: "Lunch"

# Search foods: "2 roti" opens Chapati/Roti on 2 chapati
- tapOn: "Search foods"
- tapOn: "e.g. atta, dal, paneer"
- inputText: "2 roti"
- hideKeyboard
- extendedWaitUntil:
    visible: "Chapati/Roti, 202 kcal per 100 g, estimated"
    timeout: 120000
- tapOn: "Chapati/Roti, 202 kcal per 100 g, estimated"
- extendedWaitUntil:
    visible: "Quantity: 2"
    timeout: 10000
- assertVisible: "Adds 146 kcal"
- assertVisible: "Protein: 4.2 g"
- assertVisible: "Carbs: 25.7 g"
- assertVisible: "Fat: 2.6 g"
- assertVisible: "Fibre: 4.5 g"

# Double: 4 chapati
- tapOn: "Type the quantity"
- eraseText: 6
- inputText: "4"
- hideKeyboard
- extendedWaitUntil:
    visible: "Quantity: 4"
    timeout: 5000
- assertVisible: "Adds 291 kcal"
- assertVisible: "Protein: 8.5 g"
- assertVisible: "Carbs: 51.3 g"
- assertVisible: "Fat: 5.1 g"
- assertVisible: "Fibre: 9.1 g"

# Half: 1 chapati
- tapOn: "Type the quantity"
- eraseText: 6
- inputText: "1"
- hideKeyboard
- extendedWaitUntil:
    visible: "Quantity: 1"
    timeout: 5000
- assertVisible: "Adds 73 kcal"
- assertVisible: "Protein: 2.1 g"
- assertVisible: "Carbs: 12.8 g"
- assertVisible: "Fat: 1.3 g"
- assertVisible: "Fibre: 2.3 g"
