appId: com.fitsphere.app
name: Sign in with wrong details shows one neutral message (ACC-07)
tags:
  - smoke
---
# Try 1: a real account, wrong password
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Forgot password?"
    timeout: 20000
- tapOn: "Email"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: "Password"
- inputText: "wrongpass1"
- hideKeyboard
- tapOn:
    text: "Sign in"
    below:
      text: "Forgot password?"
- extendedWaitUntil:
    visible: "Email or password is incorrect."
    timeout: 20000
- assertNotVisible: "Calories"

# Try 2: an email with no account
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Forgot password?"
    timeout: 20000
- tapOn: "Email"
- inputText: "noaccount.fs99@example.com"
- hideKeyboard
- tapOn: "Password"
- inputText: "wrongpass1"
- hideKeyboard
- tapOn:
    text: "Sign in"
    below:
      text: "Forgot password?"
- extendedWaitUntil:
    visible: "Email or password is incorrect."
    timeout: 20000
- assertNotVisible: "Calories"
