appId: com.fitsphere.app
name: Calorie target by date; Home's remaining is target minus eaten (SET-02, HOME-04)
tags:
  - smoke
---
# A target can't be removed: once set, Home says "N kcal remaining" (or "over") with "146 of 2,000 kcal"
# under it, never "N kcal eaten". Tests 4 and 5 read Home either way, so this runs on the same account.
# Each run sets 2,100 (the new value), checks today and a day last week, then sets 2,000 again and
# keeps it. So every day before today holds 2,000 (or no target), never 2,100, and the past-day check
# holds on any later run. One row per day: Target history gains at most one change per day run.

# Sign in (as smoke-01)
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Forgot password?"
    timeout: 20000
- tapOn: "Email"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
# Stops here, clearly, when EMAIL is not a real address (Sign in would stay greyed)
- assertNotVisible: "Check your email address to sign in."
- tapOn:
    text: "Sign in"
    below:
      text: "Forgot password?"
# A new account asks its age once ("Set up your account"); an older one goes straight to Home;
# a refused sign-in stops the test at once
- extendedWaitUntil:
    visible: "Calories|I am 18 or older|Email or password is incorrect."
    timeout: 90000
- assertNotVisible:
    text: "Email or password is incorrect."
    label: "Sign-in accepted (if not: the account must exist, its email be confirmed, the password right)"
- runFlow:
    when:
      visible: "I am 18 or older"
    commands:
      - tapOn: "I am 18 or older"
      - tapOn: "Continue"
- extendedWaitUntil:
    visible: "Calories"
    timeout: 90000

# ---- SET-02: the new target, 2,100 kcal, from today ----
- tapOn: "Account"
# Your targets is below Profile, Appearance, Units and AI meal reading
- scrollUntilVisible:
    element:
      text: "Your targets"
    direction: DOWN
    timeout: 15000
- tapOn: "Your targets"
- extendedWaitUntil:
    visible: "Daily calories: .*"
    timeout: 10000
- tapOn: "Daily calories: .*"
- extendedWaitUntil:
    visible: "Daily calories in kcal"
    timeout: 5000
- assertVisible: "From today, .* Earlier days keep the target they had."
- eraseText: 10
- inputText: "2100"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Daily calories: 2,100 kcal"
    timeout: 10000
- tapOn: "Navigate up|Back"
- tapOn: "Navigate up|Back"

# Home today: 2,100 left with nothing eaten
- extendedWaitUntil:
    visible: "2,100 kcal remaining"
    timeout: 10000
- assertVisible: "0 of 2,100 kcal"

# A day last week keeps its old target: anything but 2,100
- tapOn: "Earlier days"
- tapOn: "Wednesday .*"
- extendedWaitUntil:
    visible: "Back to today"
    timeout: 10000
- assertVisible: "[0-9,]+ kcal (eaten|remaining|over)"
- assertNotVisible: "[0-9,]+ of 2,100 kcal"
- assertNotVisible: "2,100 kcal remaining"
- tapOn: "Back to today"
- extendedWaitUntil:
    visible: "2,100 kcal remaining"
    timeout: 10000

# ---- Back to 2,000 kcal, the value later runs' past days will show ----
- tapOn: "Account"
# Your targets is below Profile, Appearance, Units and AI meal reading
- scrollUntilVisible:
    element:
      text: "Your targets"
    direction: DOWN
    timeout: 15000
- tapOn: "Your targets"
- extendedWaitUntil:
    visible: "Daily calories: 2,100 kcal"
    timeout: 10000
- tapOn: "Daily calories: 2,100 kcal"
- extendedWaitUntil:
    visible: "Daily calories in kcal"
    timeout: 5000
- eraseText: 10
- inputText: "2000"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Daily calories: 2,000 kcal"
    timeout: 10000
- tapOn: "Navigate up|Back"
- tapOn: "Navigate up|Back"

# ---- HOME-04: remaining = target minus eaten ----
- extendedWaitUntil:
    visible: "2,000 kcal remaining"
    timeout: 10000
- assertVisible: "0 of 2,000 kcal"

# 2 roti to Lunch (as test 4): 146 kcal
- tapOn: "Nutrition"
- tapOn: "Add to Breakfast"
- extendedWaitUntil:
    visible: "Search foods"
    timeout: 10000
- tapOn: "Lunch"
- tapOn: "Search foods"
- tapOn: "e.g. atta, dal, paneer"
- inputText: "2 roti"
- hideKeyboard
- extendedWaitUntil:
    visible: "Chapati/Roti, 202 kcal per 100 g, estimated"
    timeout: 120000
- tapOn: "Chapati/Roti, 202 kcal per 100 g, estimated"
- extendedWaitUntil:
    visible: "Quantity: 2"
    timeout: 10000
- tapOn: "Add"
- tapOn: "Save lunch"
- extendedWaitUntil:
    visible: "Lunch saved.*"
    timeout: 10000
# The back arrow scrolls with the page (Log meal since 19 Nov): back up to it first
- scrollUntilVisible:
    element:
      text: "Back|Navigate up"
    direction: UP
    timeout: 10000
- tapOn: "Back|Navigate up"
- tapOn: "Home"
- extendedWaitUntil:
    visible: "1,854 kcal remaining"
    timeout: 10000
- assertVisible: "146 of 2,000 kcal"

# Delete the lunch (as test 4): back to 2,000 left
- tapOn: "Nutrition"
- tapOn: "Show Lunch meals"
- tapOn: "Remove Chapati/Roti from Lunch"
- assertVisible: "It is the only food in this meal, so the meal is deleted."
- tapOn: "Delete meal"
- tapOn: "Home"
- extendedWaitUntil:
    visible: "2,000 kcal remaining"
    timeout: 10000
- assertVisible: "0 of 2,000 kcal"
