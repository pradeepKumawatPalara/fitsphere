appId: com.fitsphere.app
name: Workout timer and the Workout in progress pill; Mark done; then delete (TRAIN-13, TRAIN-14)
tags:
  - smoke
---
# One exercise (a 20-minute walk), so the workout is listed (D-108) and Mark done can be pressed.
# "The time changes" is checked by copying the time shown, then waiting until it is gone: no fixed
# sleeps. Dragging the pill to another corner stays manual. The workout is deleted at the end; the
# test starts only from a day with no workouts, so this one is "Workout 1".

# Sign in (as smoke-01)
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Forgot password?"
    timeout: 20000
- tapOn: "Email"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "Sign in"
    below:
      text: "Forgot password?"
- extendedWaitUntil:
    visible: "Calories"
    timeout: 90000

# Training, By day, today: no workout yet; log one with a 20-minute walk (as smoke-07)
- tapOn: "Training"
- extendedWaitUntil:
    visible: "No workouts on .*"
    timeout: 30000
- tapOn: "Log workout for today"
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 10000
- tapOn: "Add exercise"
- extendedWaitUntil:
    visible: "Search or type an exercise"
    timeout: 10000
- tapOn: "Search or type an exercise"
- inputText: "walking"
- extendedWaitUntil:
    visible: "Walking, .*"
    timeout: 60000
- tapOn: "Walking, .*"
- tapOn: "Time, minutes"
- inputText: "20"
- hideKeyboard
- tapOn: "Save exercise"
- extendedWaitUntil:
    visible: "Walking: 20:00.*"
    timeout: 10000

# ---- The timer (TRAIN-13): Start, it runs ----
- tapOn: "Start workout"
- extendedWaitUntil:
    visible: "Workout time .*"
    timeout: 10000
- assertVisible: "Pause"
- assertVisible: "Mark done"
- copyTextFrom:
    text: "Workout time .*"
- extendedWaitUntil:
    notVisible: "${maestro.copiedText}"
    timeout: 5000

# Pause shows Resume, and the time is read as paused
- tapOn: "Pause"
- extendedWaitUntil:
    visible: "Resume"
    timeout: 5000
- assertVisible: "Workout time .*, paused"

# Resume runs again
- tapOn: "Resume"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 5000
- copyTextFrom:
    text: "Workout time .*"
- extendedWaitUntil:
    notVisible: "${maestro.copiedText}"
    timeout: 5000

# ---- The pill (TRAIN-14): on Home, still on Nutrition; a tap opens the same workout ----
- tapOn: "Navigate up|Back"
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Workout 1, running, .*"
    timeout: 10000
- tapOn: "Nutrition"
- extendedWaitUntil:
    visible: "Workout 1, running, .*"
    timeout: 10000
- tapOn: "Workout 1, running, .*"
- extendedWaitUntil:
    visible: "Workout 1 · .*"
    timeout: 10000
- assertVisible: "Walking: 20:00.*"
- assertVisible: "Workout time .*"

# ---- Mark done: "Done" with the total time; the timer bar goes ----
- tapOn: "Mark done"
- extendedWaitUntil:
    visible: "Done, total time .*"
    timeout: 10000
- assertNotVisible: "Mark done"

# The pill is gone from Home
- tapOn: "Navigate up|Back"
- tapOn: "Home"
- extendedWaitUntil:
    notVisible: "Workout 1, (running|paused), .*"
    timeout: 10000

# ---- Delete it (as smoke-07); Training's row says Done with the time first ----
- tapOn: "Training"
- extendedWaitUntil:
    visible: ".*, Workout 1: 1 exercise · Walking; Done · .*"
    timeout: 10000
- tapOn: ".*, Workout 1: 1 exercise · Walking; Done · .*"
- scrollUntilVisible:
    element:
      text: "Delete workout"
    direction: DOWN
    timeout: 10000
- tapOn: "Delete workout"
- extendedWaitUntil:
    visible: 'Delete Workout 1 on .*\?'
    timeout: 5000
- assertVisible: "Its 1 exercise will be deleted too. It will no longer count in this week.s workouts. You can.t undo this."
- scrollUntilVisible:
    element:
      text: "Delete"
    direction: DOWN
    timeout: 10000
- tapOn: "Delete"

# Training no longer lists it for today
- extendedWaitUntil:
    visible: "No workouts on .*"
    timeout: 10000
